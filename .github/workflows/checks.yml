name: Mathematics portfolio checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check academic artifacts and local links
        run: python3 scripts/verify_repository.py
      - name: Run mathematical regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Run the study examples
        run: python3 -m src.workbench
